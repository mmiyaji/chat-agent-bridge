services:
  mattermost:
    image: mattermost/mattermost-preview@sha256:90319a856c49f0aef1000ab473ad76be3a8a97bef196424764638ee132eb61bc
    container_name: cab-winui-e2e
    restart: unless-stopped
    ports:
      - "127.0.0.1:8070:8065"
    environment:
      MM_SERVICESETTINGS_SITEURL: "http://127.0.0.1:8070"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_SERVICESETTINGS_ENABLETESTING: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8065 && printf 'GET /api/v4/system/ping HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 15 <&3 | grep -q '200 OK'\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">System and request flow</title>
  <desc id="desc">The requester mentions a dedicated Bot from their own chat account on a phone or browser. Chat Agent Bridge on the local PC checks allowed users and passes the request to Codex CLI or Claude Code CLI, which must be installed separately. The CLI runs the AI agent with credentials configured on the PC, and the Bot returns the result in the same thread.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="12" refY="6" viewBox="0 0 12 12" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2864A5"/></marker>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="12" refY="6" viewBox="0 0 12 12" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#526579"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#202833"/>
  <text x="38" y="61" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">System and request flow</text>
  <rect x="24" y="88" width="1232" height="608" rx="20" fill="#FFFFFF"/>

  <g fill="#F8FAFC" stroke="#D7E0E9" stroke-width="2"><rect x="44" y="116" width="266" height="460" rx="16"/><rect x="336" y="116" width="286" height="460" rx="16"/><rect x="648" y="116" width="286" height="460" rx="16"/><rect x="960" y="116" width="276" height="460" rx="16"/></g>
  <g fill="#173B6C"><circle cx="78" cy="153" r="23"/><circle cx="370" cy="153" r="23"/><circle cx="682" cy="153" r="23"/><circle cx="994" cy="153" r="23"/></g>
  <g font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF"><text x="71" y="161" font-size="24">1</text><text x="363" y="161" font-size="24">2</text><text x="675" y="161" font-size="24">3</text><text x="987" y="161" font-size="24">4</text></g>
  <g font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="27" font-weight="700" fill="#23364A"><text x="112" y="162" font-size="27">Requester</text><text x="404" y="162" font-size="27">Chat</text><text x="716" y="162" font-size="27">Local PC</text><text x="1028" y="162" font-size="27">Result</text></g>

  <!-- Requester with phone and browser -->
  <g fill="#FFFFFF" stroke="#8293A5" stroke-width="4"><rect x="80" y="216" width="70" height="126" rx="13"/><rect x="172" y="232" width="102" height="68" rx="8"/></g>
  <path d="M102 231 H128 M212 301 V315 M190 316 H234" fill="none" stroke="#8293A5" stroke-width="4" stroke-linecap="round"/>
  <circle cx="115" cy="326" r="4" fill="#8293A5"/><circle cx="187" cy="246" r="3" fill="#C6D1DC"/><circle cx="198" cy="246" r="3" fill="#C6D1DC"/><circle cx="209" cy="246" r="3" fill="#C6D1DC"/>
  <text x="72" y="382" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="22" font-weight="700" fill="#23364A">Request from phone /</text>
  <text x="72" y="414" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="22" font-weight="700" fill="#23364A">browser</text>
  <rect x="64" y="449" width="226" height="58" rx="10" fill="#E9EEF3"/>
  <text x="83" y="485" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="17" font-weight="700" fill="#23364A">Your own chat account</text>

  <!-- Chat service and dedicated bot -->
  <rect x="352" y="190" width="254" height="353" rx="14" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2"/>
  <g font-family="Segoe UI, Noto Sans JP, sans-serif" fill="#23364A"><text x="370" y="231" font-size="18" font-weight="700">Slack / Mattermost /</text><text x="370" y="258" font-size="18" font-weight="700">Discord</text></g>
  <circle cx="479" cy="337" r="44" fill="#EAF3FB"/>
  <g transform="translate(455 309)"><circle cx="24" cy="22" r="22" fill="#DDEAF6"/><rect x="11" y="14" width="26" height="19" rx="6" fill="#FFFFFF" stroke="#2864A5" stroke-width="2"/><circle cx="19" cy="23" r="2" fill="#2864A5"/><circle cx="29" cy="23" r="2" fill="#2864A5"/><path d="M24 14 V8 M21 8 H27 M16 36 L12 41 M32 36 L36 41" fill="none" stroke="#2864A5" stroke-width="2" stroke-linecap="round"/></g>
  <text x="371" y="405" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#23364A">Dedicated Bot account</text>
  <text x="371" y="433" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" fill="#526579">Slack / Mattermost / Discord</text>
  <rect x="369" y="452" width="220" height="65" rx="10" fill="#E9EEF3"/>
  <text x="384" y="479" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="15" fill="#526579">Relays chat requests and results</text>
  <text x="384" y="503" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" fill="#526579">A dedicated account is recommended</text>

  <!-- Local PC, Bridge, CLI, and project -->
  <rect x="664" y="190" width="254" height="353" rx="14" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2"/>
  <rect x="682" y="211" width="218" height="97" rx="11" fill="#EAF3FB" stroke="#A9C4DF" stroke-width="2"/>
  <rect x="696" y="232" width="36" height="34" rx="5" fill="#2864A5"/><path d="M703 241 H725 M703 249 H721 M703 257 H717" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="742" y="247" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#23364A">Chat Agent</text><text x="742" y="275" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#23364A">Bridge</text>
  <text x="697" y="296" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" fill="#526579">Checks allowed users</text>
  <path d="M791 312 V326" stroke="#2864A5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="682" y="333" width="218" height="115" rx="11" fill="#FFFFFF" stroke="#AEBBC8" stroke-width="2"/><rect x="694" y="345" width="194" height="29" rx="6" fill="#EAF3FB"/>
  <text x="700" y="366" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="16" font-weight="700" fill="#23364A">AI agent CLI examples</text>
  <text x="700" y="397" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="16" fill="#23364A">Codex CLI</text><text x="700" y="422" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="16" fill="#23364A">Claude Code CLI</text>
  <text x="700" y="442" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="12" fill="#526579">Not bundled; install separately</text>
  <path d="M791 451 V464" stroke="#2864A5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <rect x="682" y="470" width="218" height="55" rx="10" fill="#F2F4F7"/><path d="M695 483 H713 L721 491 H736 V515 H695 Z" fill="#DDEAF6" stroke="#526579" stroke-width="2" stroke-linejoin="round"/>
  <text x="744" y="494" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" font-weight="700" fill="#23364A">Configured project</text><text x="744" y="515" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="13" fill="#526579">Uses PC AI credentials</text>

  <!-- Conversation example in the result step -->
  <rect x="978" y="190" width="240" height="353" rx="14" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2"/><rect x="978" y="190" width="240" height="39" rx="14" fill="#E9EEF3"/>
  <circle cx="997" cy="210" r="5" fill="#AEBBC8"/><circle cx="1015" cy="210" r="5" fill="#AEBBC8"/><circle cx="1033" cy="210" r="5" fill="#AEBBC8"/>
  <circle cx="1000" cy="261" r="19" fill="#DDEAF6"/><circle cx="1000" cy="255" r="6" fill="#2864A5"/><path d="M989 273 Q1000 261 1011 273" fill="#2864A5"/><rect x="1028" y="239" width="174" height="73" rx="10" fill="#EAF3FB"/>
  <text x="1040" y="263" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="15" font-weight="700" fill="#2864A5">@BridgeBot</text><text x="1040" y="286" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" fill="#526579">Please do this task</text>
  <circle cx="1000" cy="365" r="19" fill="#DDEAF6"/><rect x="989" y="357" width="22" height="16" rx="5" fill="#FFFFFF" stroke="#2864A5" stroke-width="2"/><circle cx="996" cy="365" r="1.5" fill="#2864A5"/><circle cx="1004" cy="365" r="1.5" fill="#2864A5"/>
  <rect x="1028" y="336" width="174" height="103" rx="10" fill="#F2F4F7"/><text x="1040" y="360" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="15" font-weight="700" fill="#23364A">BridgeBot</text>
  <text x="1040" y="385" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" fill="#526579">Task completed.</text><text x="1040" y="409" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="14" fill="#526579">Here is the result.</text>
  <rect x="992" y="462" width="212" height="49" rx="9" fill="#EAF3FB"/><text x="1005" y="492" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="15" font-weight="700" fill="#23364A">Reply in the same thread</text>
  <path d="M312 326 H330" fill="none" stroke="#2864A5" stroke-width="5" marker-end="url(#arrowBlue)"/><path d="M624 326 H642" fill="none" stroke="#2864A5" stroke-width="5" marker-end="url(#arrowBlue)"/><path d="M936 326 H954" fill="none" stroke="#2864A5" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <!-- Role notes -->
  <rect x="44" y="611" width="1192" height="66" rx="12" fill="#EEF2F6"/>
  <g transform="translate(67 626)"><circle cx="26" cy="18" r="19" fill="#DDEAF6"/><rect x="15" y="12" width="22" height="16" rx="5" fill="#FFFFFF" stroke="#2864A5" stroke-width="2"/><circle cx="22" cy="20" r="1.8" fill="#2864A5"/><circle cx="30" cy="20" r="1.8" fill="#2864A5"/></g>
  <text x="122" y="651" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="17" font-weight="700" fill="#23364A">Bot: Use a dedicated account; relays chat requests and results</text>
  <line x1="662" y1="625" x2="662" y2="663" stroke="#AEBBC8" stroke-width="2"/><rect x="690" y="632" width="36" height="30" rx="5" fill="#23364A"/><path d="M700 641 L708 647 L700 653 M712 653 H718" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="741" y="646" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="16" font-weight="700" fill="#23364A">CLI: Codex CLI / Claude Code CLI (install separately)</text>
  <text x="741" y="668" font-family="Segoe UI, Noto Sans JP, sans-serif" font-size="15" fill="#526579">Runs the AI agent with credentials configured on the PC</text>
</svg>

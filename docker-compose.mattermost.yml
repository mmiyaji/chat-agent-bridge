services:
  mattermost:
    image: mattermost/mattermost-preview:latest
    container_name: cab-mattermost-preview
    restart: unless-stopped
    ports:
      - "8065:8065"
    environment:
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_SERVICESETTINGS_ENABLETESTING: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
    healthcheck:
      # mattermost-preview has neither curl nor wget, and /bin/sh is dash
      # (no /dev/tcp support), so invoke bash explicitly to probe the ping
      # endpoint over a raw TCP socket.
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/8065 && printf 'GET /api/v4/system/ping HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 15 <&3 | grep -q '200 OK'\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
